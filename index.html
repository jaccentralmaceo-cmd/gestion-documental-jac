<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestión Documental — Tejiendo Arte en la Tierra de Ensueño</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EFE8D8;
  --paper-raised:#F7F2E6;
  --ink:#23303D;
  --ink-soft:#5B6472;
  --teal:#2F6B5E;
  --teal-deep:#204A41;
  --ocre:#C17817;
  --terra:#A84B32;
  --line:#D8CDB0;
  --line-soft:#E4DCC5;
  --radius:3px;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:'Work Sans',sans-serif;
  font-size:14.5px;
  line-height:1.5;
}
h1,h2,h3,.display{font-family:'Fraunces',serif;}
.mono{font-family:'IBM Plex Mono',monospace;}

/* -- stitch divider, the signature element -- */
.stitch{
  height:8px;
  background-image:
    repeating-linear-gradient(115deg, var(--teal) 0 6px, transparent 6px 13px),
    repeating-linear-gradient(115deg, var(--ocre) 0 6px, transparent 6px 13px);
  background-position: 0 0, 7px 0;
  background-size: 200% 100%;
  opacity:.85;
}
.stitch.thin{height:3px;}

#app{display:flex;min-height:100vh;}

/* SIDEBAR */
#sidebar{
  width:250px;flex-shrink:0;
  background:var(--teal-deep);
  color:#EFE8D8;
  display:flex;flex-direction:column;
}
#sidebar .brand{padding:22px 20px 14px;}
#sidebar .brand .tag{
  font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;color:#B9CFC7;
}
#sidebar .brand h1{font-size:19px;margin:6px 0 0;line-height:1.2;color:#fff;}
#sidebar .brand .sub{font-size:11.5px;color:#B9CFC7;margin-top:6px;}
nav{padding:8px 12px;flex:1;}
nav .group-label{
  font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:#8FAAA1;
  padding:16px 10px 6px;
}
nav button{
  display:block;width:100%;text-align:left;
  background:none;border:none;color:#DCE8E3;
  padding:9px 10px;border-radius:var(--radius);cursor:pointer;
  font-family:'Work Sans',sans-serif;font-size:13.5px;
  display:flex;justify-content:space-between;align-items:center;
}
nav button:hover{background:rgba(255,255,255,.08);}
nav button.active{background:var(--ocre);color:#2b1c05;font-weight:600;}
nav button .count{
  font-family:'IBM Plex Mono',monospace;font-size:10.5px;
  background:rgba(255,255,255,.14);padding:1px 6px;border-radius:9px;
}
nav button.active .count{background:rgba(0,0,0,.18);}
#sidebar .foot{padding:12px 20px 18px;font-size:10.5px;color:#8FAAA1;border-top:1px solid rgba(255,255,255,.12);}

/* MAIN */
#main{flex:1;padding:30px 40px 60px;max-width:980px;}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:6px;}
.pagehead h2{font-size:26px;margin:0;}
.pagehead .desc{color:var(--ink-soft);font-size:13px;margin-top:4px;}
.btn{
  border:1px solid var(--ink);background:var(--ink);color:var(--paper-raised);
  padding:9px 16px;border-radius:var(--radius);cursor:pointer;
  font-family:'Work Sans',sans-serif;font-size:13.5px;font-weight:600;
}
.btn:hover{background:var(--teal-deep);border-color:var(--teal-deep);}
.btn.secondary{background:transparent;color:var(--ink);}
.btn.secondary:hover{background:rgba(0,0,0,.05);}
.btn.danger{background:transparent;border-color:var(--terra);color:var(--terra);}
.btn.danger:hover{background:var(--terra);color:#fff;}
.btn.small{padding:5px 10px;font-size:12px;}

/* dashboard */
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;margin:22px 0 30px;}
.stat-card{
  background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px 18px;cursor:pointer;
}
.stat-card:hover{border-color:var(--teal);}
.stat-card .n{font-family:'Fraunces',serif;font-size:30px;color:var(--teal-deep);}
.stat-card .l{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}

.panel{background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;margin-bottom:20px;}
.panel h3{font-size:15px;margin:0 0 10px;}
.empty{color:var(--ink-soft);font-size:13px;padding:10px 0;}

.compromiso-row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-soft);font-size:13px;}
.compromiso-row:last-child{border-bottom:none;}
.compromiso-row .badge{
  font-family:'IBM Plex Mono',monospace;font-size:10.5px;padding:2px 7px;border-radius:9px;white-space:nowrap;
}
.badge.overdue{background:#F3DCD5;color:var(--terra);}
.badge.soon{background:#F4E6C9;color:#7A5108;}
.badge.ok{background:#DCE9E3;color:var(--teal-deep);}

/* doc list */
.doc-card{
  background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px 18px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:14px;
}
.doc-card .num{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ocre);}
.doc-card .title{font-weight:600;margin:2px 0 3px;}
.doc-card .meta{font-size:12px;color:var(--ink-soft);}
.doc-card .actions{display:flex;gap:6px;flex-shrink:0;}

/* form */
form .field{margin-bottom:16px;}
form label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;text-transform:uppercase;letter-spacing:.02em;}
form input[type=text],form input[type=date],form input[type=time],form select,form textarea{
  width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:var(--radius);
  background:#fff;font-family:'Work Sans',sans-serif;font-size:13.5px;color:var(--ink);
}
form textarea{min-height:90px;resize:vertical;font-family:'Work Sans',sans-serif;}
form .row2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.checkgroup{display:flex;flex-wrap:wrap;gap:8px 16px;}
.checkgroup label{
  display:flex;align-items:center;gap:6px;font-weight:400;text-transform:none;font-size:13px;color:var(--ink);margin:0;
}
.checkgroup input{width:auto;}
table.editable{width:100%;border-collapse:collapse;margin-top:4px;}
table.editable th{
  font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);text-align:left;
  padding:0 6px 6px;border-bottom:1px solid var(--line);
}
table.editable td{padding:4px 6px 4px 0;vertical-align:top;}
table.editable input{padding:6px 8px;font-size:13px;}
table.editable .rm{background:none;border:none;color:var(--terra);cursor:pointer;font-size:16px;padding:0 6px;}
.addrow{background:none;border:1px dashed var(--line);color:var(--teal-deep);padding:6px 12px;border-radius:var(--radius);
  cursor:pointer;font-size:12.5px;margin-top:6px;}
.formfoot{display:flex;gap:10px;margin-top:24px;}

/* preview / printable document */
#preview-wrap{background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
.preview-toolbar{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line);}
.preview-toolbar .actions{display:flex;gap:8px;}
#doc-sheet{padding:44px 50px;max-width:760px;margin:0 auto;font-family:'Work Sans',sans-serif;color:#1a2430;}
#doc-sheet .doc-eyebrow{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--teal-deep);}
#doc-sheet h1.doc-title{font-family:'Fraunces',serif;font-size:22px;margin:6px 0 2px;}
#doc-sheet .doc-sub{font-size:12px;color:var(--ink-soft);margin-bottom:4px;}
#doc-sheet .doc-num{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ocre);margin-top:8px;}
#doc-sheet section{margin-top:22px;}
#doc-sheet section h2{font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--teal-deep);
  border-bottom:1px solid var(--line);padding-bottom:5px;margin:0 0 10px;font-family:'Work Sans',sans-serif;font-weight:700;}
#doc-sheet p{margin:0 0 8px;font-size:13.5px;white-space:pre-wrap;}
#doc-sheet table.doc-table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:4px;}
#doc-sheet table.doc-table th,#doc-sheet table.doc-table td{border:1px solid var(--line);padding:6px 8px;text-align:left;}
#doc-sheet table.doc-table th{background:var(--line-soft);font-size:11px;text-transform:uppercase;letter-spacing:.03em;}
#doc-sheet .checklist span{display:inline-block;margin:0 14px 4px 0;font-size:13px;}
#doc-sheet .checklist .box{display:inline-block;width:11px;height:11px;border:1px solid var(--ink);margin-right:5px;vertical-align:-1px;}
#doc-sheet .checklist .box.on{background:var(--teal);border-color:var(--teal);}
#doc-sheet .sigblock{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:8px;}
#doc-sheet .sigline{border-top:1px solid var(--ink);margin-top:34px;padding-top:5px;font-size:12px;}
#doc-sheet .foot{margin-top:36px;border-top:2px solid var(--teal);padding-top:10px;font-size:10.5px;color:var(--ink-soft);}

@media print{
  #sidebar,.preview-toolbar,.pagehead .btn{display:none !important;}
  #main{padding:0;max-width:none;}
  #preview-wrap{border:none;}
  #doc-sheet{padding:0;max-width:none;}
  body{background:#fff;}
}

/* -- badges: radicado / firma -- */
.badge2{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:10.5px;padding:2px 8px;border-radius:9px;margin-left:6px;}
.badge2.rad{background:#DCE9E3;color:var(--teal-deep);}
.badge2.pend{background:#F4E6C9;color:#7A5108;}
.badge2.firmado{background:#DCE9E3;color:var(--teal-deep);}

.sign-panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-top:10px;}
.sign-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line-soft);}
.sign-row:last-child{border-bottom:none;}
.sign-row .who{font-size:13px;}
.sign-row .who b{display:block;}
.sign-row .who span{color:var(--ink-soft);font-size:12px;}

/* -- standalone pages: login / setup / firmar -- */
.standalone{min-height:100vh;width:100%;display:flex;align-items:center;justify-content:center;background:var(--paper);}
.auth-card{background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius);padding:36px 34px;width:100%;max-width:400px;}
.auth-card .tag{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--teal-deep);}
.auth-card h1{font-size:20px;margin:6px 0 2px;}
.auth-card .sub{font-size:12.5px;color:var(--ink-soft);margin-bottom:20px;}
.auth-card .error{background:#F3DCD5;color:var(--terra);font-size:12.5px;padding:8px 10px;border-radius:var(--radius);margin-bottom:14px;}
.auth-card .note{font-size:11.5px;color:var(--ink-soft);margin-top:16px;line-height:1.5;}
.auth-card .btn{width:100%;margin-top:6px;}

.sign-doc-frame{background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius);max-width:760px;width:100%;margin:0 auto 20px;padding:30px 34px;}
.sign-actions{background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius);max-width:760px;width:100%;margin:0 auto;padding:24px 34px;}
.sign-actions label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin:14px 0 6px;text-transform:uppercase;}
.sign-actions input[type=text]{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:var(--radius);font-size:14px;}
.sign-actions .accept{display:flex;align-items:flex-start;gap:8px;font-size:13px;margin-top:14px;}
.sign-actions .accept input{margin-top:3px;}
.confirm-box{text-align:center;padding:30px;color:var(--teal-deep);font-family:'Fraunces',serif;font-size:18px;}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <div class="brand">
      <div class="tag">Sistema documental</div>
      <h1>Tejiendo Arte<br>en la Tierra de Ensueño</h1>
      <div class="sub">JAC Central Urbana · Maceo, Antioquia</div>
    </div>
    <div class="stitch thin"></div>
    <nav id="nav"></nav>
    <div class="foot" id="sidebar-foot">Los documentos se comparten entre todos los integrantes con acceso.</div>
  </div>
  <div id="main"></div>
</div>

<script>
/* ---------------------------------------------------------------
   DOCUMENT TYPE SCHEMAS
--------------------------------------------------------------- */
const TIPO_REUNION_OPCIONES = ['Planeación','Seguimiento','Coordinación','Comité técnico','Reunión comunitaria','Reunión con talleristas','Reunión con aliados','Cierre','Otra'];
const EVIDENCIA_OPCIONES = ['Registro fotográfico','Lista de asistencia','Presentación','Documentos anexos','Material audiovisual','Otro'];

const TYPES = {
  acta: {
    label:'Actas de Reunión', singular:'Acta de reunión', prefix:'ACTA', group:'Reuniones',
    titleOf: d => d.objetivo ? d.objetivo.slice(0,70) : '(sin objetivo)',
    dateOf: d => d.fecha,
    fields: [
      {id:'fecha', label:'Fecha', type:'date'},
      {id:'horaInicio', label:'Hora de inicio', type:'time'},
      {id:'horaFin', label:'Hora de finalización', type:'time'},
      {id:'lugar', label:'Lugar', type:'text'},
      {id:'municipio', label:'Municipio', type:'text', default:'Maceo – Antioquia'},
      {id:'tipoReunion', label:'Tipo de reunión', type:'checkboxes', options:TIPO_REUNION_OPCIONES},
      {id:'objetivo', label:'Objetivo de la reunión', type:'textarea'},
      {id:'participantes', label:'Participantes', type:'table', columns:[
        {id:'nombre',label:'Nombre completo'},{id:'cargo',label:'Cargo / Rol'},{id:'organizacion',label:'Organización'}]},
      {id:'ordenDelDia', label:'Orden del día (un punto por línea)', type:'textarea'},
      {id:'desarrollo', label:'Desarrollo de la reunión', type:'textarea'},
      {id:'compromisos', label:'Compromisos', type:'table', columns:[
        {id:'compromiso',label:'Compromiso'},{id:'responsable',label:'Responsable'},{id:'fecha',label:'Fecha de cumplimiento',type:'date'}]},
      {id:'observaciones', label:'Observaciones', type:'textarea'},
      {id:'evidencias', label:'Evidencias', type:'checkboxes', options:EVIDENCIA_OPCIONES},
      {id:'presideNombre', label:'Quien preside — nombre', type:'text'},
      {id:'presideCargo', label:'Quien preside — cargo', type:'text'},
      {id:'elaboraNombre', label:'Quien elabora el acta — nombre', type:'text'},
      {id:'elaboraCargo', label:'Quien elabora el acta — cargo', type:'text'},
      {id:'coordinadorNombre', label:'Vo. Bo. Coordinación del Proyecto — nombre', type:'text'},
    ],
    render: (d,num) => `
      ${docHeader('Acta de Reunión', num, d.fecha)}
      <section><h2>Información general</h2>
        <p><b>Fecha:</b> ${fmtDate(d.fecha)} &nbsp; <b>Hora:</b> ${d.horaInicio||'—'} a ${d.horaFin||'—'}<br>
        <b>Lugar:</b> ${esc(d.lugar)||'—'} &nbsp; <b>Municipio:</b> ${esc(d.municipio)||'—'}</p>
        ${checklist(TIPO_REUNION_OPCIONES, d.tipoReunion)}
      </section>
      <section><h2>Objetivo</h2><p>${esc(d.objetivo)||'—'}</p></section>
      <section><h2>Participantes</h2>${table(d.participantes,[['nombre','Nombre'],['cargo','Cargo / Rol'],['organizacion','Organización']])}</section>
      <section><h2>Orden del día</h2>${list(d.ordenDelDia)}</section>
      <section><h2>Desarrollo de la reunión</h2><p>${esc(d.desarrollo)||'—'}</p></section>
      <section><h2>Compromisos</h2>${table(d.compromisos,[['compromiso','Compromiso'],['responsable','Responsable'],['fecha','Fecha',true]])}</section>
      <section><h2>Observaciones</h2><p>${esc(d.observaciones)||'—'}</p></section>
      <section><h2>Evidencias</h2>${checklist(EVIDENCIA_OPCIONES, d.evidencias)}</section>
      <section><h2>Firmas</h2>
        <div class="sigblock">
          <div><div class="sigline">${esc(d.presideNombre)||'Nombre'}<br><span style="color:var(--ink-soft)">${esc(d.presideCargo)||'Quien preside la reunión'}</span></div></div>
          <div><div class="sigline">${esc(d.elaboraNombre)||'Nombre'}<br><span style="color:var(--ink-soft)">${esc(d.elaboraCargo)||'Quien elabora el acta'}</span></div></div>
        </div>
        <div style="margin-top:34px" class="sigline">${esc(d.coordinadorNombre)||'Nombre'}<br><span style="color:var(--ink-soft)">Vo. Bo. Coordinador(a) del Proyecto</span></div>
      </section>
      ${docFooter()}`
  },

  resolucion: {
    label:'Resoluciones', singular:'Resolución', prefix:'RES', group:'Reuniones',
    titleOf: d => d.asunto || '(sin asunto)',
    dateOf: d => d.fecha,
    fields: [
      {id:'fecha', label:'Fecha', type:'date'},
      {id:'asunto', label:'Asunto / título de la resolución', type:'text'},
      {id:'considerandos', label:'Considerandos (uno por línea)', type:'textarea'},
      {id:'articulos', label:'Artículos que resuelve (uno por línea)', type:'textarea'},
      {id:'vigencia', label:'Vigencia', type:'text'},
      {id:'presidenteNombre', label:'Presidente(a) JAC — nombre', type:'text'},
      {id:'secretarioNombre', label:'Secretario(a) JAC — nombre', type:'text'},
    ],
    render: (d,num) => `
      ${docHeader('Resolución', num, d.fecha)}
      <section><h2>Asunto</h2><p>${esc(d.asunto)||'—'}</p></section>
      <section><h2>Considerandos</h2>${list(d.considerandos,'CONSIDERANDO QUE')}</section>
      <section><h2>Resuelve</h2>${list(d.articulos,'ARTÍCULO')}</section>
      <section><h2>Vigencia</h2><p>${esc(d.vigencia)||'A partir de la fecha de expedición.'}</p></section>
      <section><h2>Firmas</h2>
        <div class="sigblock">
          <div class="sigline">${esc(d.presidenteNombre)||'Nombre'}<br><span style="color:var(--ink-soft)">Presidente(a) JAC</span></div>
          <div class="sigline">${esc(d.secretarioNombre)||'Nombre'}<br><span style="color:var(--ink-soft)">Secretario(a) JAC</span></div>
        </div>
      </section>
      ${docFooter()}`
  },

  asistencia: {
    label:'Listas de Asistencia', singular:'Lista de asistencia', prefix:'LA', group:'Otros documentos',
    titleOf: d => d.actividad || '(sin actividad)',
    dateOf: d => d.fecha,
    fields: [
      {id:'fecha', label:'Fecha', type:'date'},
      {id:'actividad', label:'Actividad / taller', type:'text'},
      {id:'lugar', label:'Lugar / territorio', type:'text'},
      {id:'responsable', label:'Responsable', type:'text'},
      {id:'asistentes', label:'Asistentes', type:'table', columns:[
        {id:'nombre',label:'Nombre completo'},{id:'documento',label:'Documento'},{id:'rol',label:'Rol / territorio'}]},
    ],
    render: (d,num) => `
      ${docHeader('Lista de Asistencia', num, d.fecha)}
      <section><h2>Actividad</h2><p><b>${esc(d.actividad)||'—'}</b><br>Lugar: ${esc(d.lugar)||'—'} &nbsp; Responsable: ${esc(d.responsable)||'—'} &nbsp; Fecha: ${fmtDate(d.fecha)}</p></section>
      <section><h2>Asistentes</h2>${table(d.asistentes,[['nombre','Nombre'],['documento','Documento'],['rol','Rol / territorio']],true)}</section>
      ${docFooter()}`
  },

  informe: {
    label:'Informes de Seguimiento', singular:'Informe de seguimiento', prefix:'INF', group:'Otros documentos',
    titleOf: d => `${d.territorio||''} — ${d.periodo||''}`.replace(/^— /,'') || '(sin territorio)',
    dateOf: d => d.periodo,
    fields: [
      {id:'periodo', label:'Periodo (ej. Julio 2026)', type:'text'},
      {id:'territorio', label:'Territorio / vereda-corregimiento', type:'text'},
      {id:'responsable', label:'Responsable (tallerista / coordinación)', type:'text'},
      {id:'actividadesRealizadas', label:'Actividades realizadas', type:'textarea'},
      {id:'resultados', label:'Resultados', type:'textarea'},
      {id:'dificultades', label:'Dificultades', type:'textarea'},
      {id:'proximosPasos', label:'Próximos pasos', type:'textarea'},
      {id:'evidencias', label:'Evidencias', type:'checkboxes', options:EVIDENCIA_OPCIONES},
    ],
    render:(d,num) => `
      ${docHeader('Informe de Seguimiento', num, d.periodo)}
      <section><h2>Datos generales</h2><p><b>Periodo:</b> ${esc(d.periodo)||'—'} &nbsp; <b>Territorio:</b> ${esc(d.territorio)||'—'} &nbsp; <b>Responsable:</b> ${esc(d.responsable)||'—'}</p></section>
      <section><h2>Actividades realizadas</h2><p>${esc(d.actividadesRealizadas)||'—'}</p></section>
      <section><h2>Resultados</h2><p>${esc(d.resultados)||'—'}</p></section>
      <section><h2>Dificultades</h2><p>${esc(d.dificultades)||'—'}</p></section>

/* helper renderers shared by document previews */
function docHeader(tipo,num,fecha){
  return `<div class="doc-eyebrow">Tejiendo Arte en la Tierra de Ensueño</div>
    <h1 class="doc-title">${tipo}</h1>
    <div class="doc-sub">Programa Nacional de Concertación Cultural — Vigencia 2026 · Maceo, Antioquia</div>
    <div class="doc-num">${num} ${fecha? '· '+fmtDate(fecha):''}</div>`;
}
function docFooter(){
  return `<div class="foot">Proyecto: Tejiendo Arte en la Tierra de Ensueño &nbsp;·&nbsp; Ejecutor: Junta de Acción Comunal Central Urbana de Maceo &nbsp;·&nbsp;
  Financia: Ministerio de las Culturas, las Artes y los Saberes — Programa Nacional de Concertación Cultural 2026</div>`;
}
function checklist(options, selected){
  selected = selected||[];
  return `<div class="checklist">${options.map(o=>`<span><span class="box ${selected.includes(o)?'on':''}"></span>${esc(o)}</span>`).join('')}</div>`;
}
function list(text, prefix){
  if(!text) return '<p>—</p>';
  const items = text.split('\n').map(s=>s.trim()).filter(Boolean);
  if(!items.length) return '<p>—</p>';
  return '<ol style="margin:0;padding-left:20px;font-size:13.5px;">' + items.map((it,i)=>`<li style="margin-bottom:5px;">${prefix?`<b>${prefix} ${i+1}.</b> `:''}${esc(it)}</li>`).join('') + '</ol>';
}
function table(rows, cols, wide){
  rows = rows||[];
  if(!rows.length) return '<p>—</p>';
  return `<table class="doc-table"><thead><tr>${cols.map(c=>`<th>${c[1]}</th>`).join('')}</tr></thead><tbody>
    ${rows.map(r=>`<tr>${cols.map(c=>`<td>${c[2]?fmtDate(r[c[0]]):esc(r[c[0]])||'—'}</td>`).join('')}</tr>`).join('')}
  </tbody></table>`;
}
function esc(s){ if(s===undefined||s===null) return ''; return String(s).replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function fmtDate(s){
  if(!s) return '—';
  const parts = String(s).split('-');
  if(parts.length===3){ const meses=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic']; return `${+parts[2]} ${meses[+parts[1]-1]} ${parts[0]}`; }
  return esc(s);
}

function withTimeout(promise, ms=8000){
  return new Promise((resolve,reject)=>{
    let done=false;
    const t = setTimeout(()=>{ if(!done){ done=true; reject(new Error('timeout')); } }, ms);
    promise.then(v=>{ if(!done){ done=true; clearTimeout(t); resolve(v); } },
                 e=>{ if(!done){ done=true; clearTimeout(t); reject(e); } });
  });
}

function randToken(){
  try{
    return Array.from(crypto.getRandomValues(new Uint8Array(12))).map(b=>b.toString(16).padStart(2,'0')).join('');
  }catch(e){
    return Date.now().toString(16)+Math.random().toString(16).slice(2)+Math.random().toString(16).slice(2);
  }
}

function renderHome(){
  const today = new Date().toISOString().slice(0,10);
  const compromisos = [];
  DOCS.filter(d=>d.type==='acta').forEach(d=>{
    (d.data.compromisos||[]).forEach(c=>{ if(c.fecha) compromisos.push({...c, acta:d.data.objetivo, actaId:d.id}); });
  });
  compromisos.sort((a,b)=>(a.fecha||'').localeCompare(b.fecha||''));

  const cards = Object.entries(TYPES).map(([k,t])=>{
    const n = DOCS.filter(d=>d.type===k).length;
    return `<div class="stat-card" data-nav="list:${k}"><div class="n">${n}</div><div class="l">${t.label}</div></div>`;
  }).join('');

  const compRows = compromisos.length ? compromisos.map(c=>{
    let badge='ok', label=fmtDate(c.fecha);
    if(c.fecha < today) {badge='overdue'; label='Vencido · '+fmtDate(c.fecha);}
    else if(c.fecha <= addDays(today,7)) {badge='soon'; label='Próximo · '+fmtDate(c.fecha);}
    return `<div class="compromiso-row"><span><b>${esc(c.compromiso)||'—'}</b> — ${esc(c.responsable)||'—'}</span><span class="badge ${badge}">${label}</span></div>`;
  }).join('') : `<div class="empty">Aún no hay compromisos registrados en actas.</div>`;

  return `
    <div class="pagehead"><div><h2>Resumen del proyecto</h2><div class="desc">Tejiendo Arte en la Tierra de Ensueño — documentos y compromisos</div></div></div>
    ${storageWarningHtml()}

    <div class="panel"><h3>Compromisos de actas, por fecha de cumplimiento</h3>${compRows}</div>
  `;
}
function addDays(dateStr,n){ const d=new Date(dateStr+'T00:00:00'); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }

function renderList(typeKey){
  const t = TYPES[typeKey];
  const docs = DOCS.filter(d=>d.type===typeKey).sort((a,b)=>(b.data[dateField(typeKey)]||'').localeCompare(a.data[dateField(typeKey)]||''));
  const rows = docs.length ? docs.map(d=>`

      </div>
    </div>`).join('') : `<div class="panel"><div class="empty">Todavía no has creado ningún ${t.singular.toLowerCase()}.</div></div>`;
  return `
    <div class="pagehead">
      <div><h2>${t.label}</h2><div class="desc">${docs.length} documento${docs.length===1?'':'s'} guardado${docs.length===1?'':'s'}</div></div>
      <button class="btn" data-new="${typeKey}">+ Nuevo ${t.singular.toLowerCase()}</button>
    </div>
    ${rows}`;
}
function dateField(typeKey){
  const t = TYPES[typeKey];
  // reuse dateOf logic but need the raw field name for sorting; approximate via first date-typed field
  const f = t.fields.find(f=>f.type==='date');
  return f ? f.id : (t.fields[0]?t.fields[0].id:'fecha');
}

function fieldInput(f, value){
  value = value===undefined ? (f.default||'') : value;
  if(f.type==='textarea') return `<textarea data-field="${f.id}">${esc(value)}</textarea>`;
  if(f.type==='select') return `<select data-field="${f.id}"><option value=""></option>${f.options.map(o=>`<option ${value===o?'selected':''}>${o}</option>`).join('')}</select>`;
  if(f.type==='checkboxes'){
    const sel = value||[];
    return `<div class="checkgroup" data-field="${f.id}">${f.options.map(o=>`<label><input type="checkbox" value="${esc(o)}" ${sel.includes(o)?'checked':''}> ${esc(o)}</label>`).join('')}</div>`;
  }
  if(f.type==='table'){
    const rows = value && value.length ? value : [{}];
    return `<div data-field="${f.id}" data-table="${f.id}">
      <table class="editable"><thead><tr>${f.columns.map(c=>`<th>${c.label}</th>`).join('')}<th></th></tr></thead>
      <tbody>${rows.map(r=>tableRow(f,r)).join('')}</tbody></table>
      <button type="button" class="addrow" data-addrow="${f.id}">+ Agregar fila</button>
    </div>`;
  }
  return `<input type="${f.type}" data-field="${f.id}" value="${esc(value)}">`;
}
function tableRow(f, r){
  r = r||{};
  return `<tr>${f.columns.map(c=>`<td><input type="${c.type||'text'}" data-col="${c.id}" value="${esc(r[c.id])}"></td>`).join('')}<td><button type="button" class="rm" data-rmrow="1">×</button></td></tr>`;
}

  return `
    <div class="pagehead"><div><h2>${existing?'Editar':'Nuevo'} ${t.singular.toLowerCase()}</h2>
      <div class="desc mono">${numero}</div></div></div>
    <form id="doc-form">
      ${t.fields.map(f=>`<div class="field"><label>${f.label}</label>${fieldInput(f, data[f.id])}</div>`).join('')}
      <div class="formfoot">

        <button type="button" class="btn secondary" data-cancel="1">Cancelar</button>
      </div>
    </form>`;
}

function renderPreview(id){

  const radBadge = d.radicado
    ? `<span class="badge2 rad">Radicado ${esc(d.radicado.folio)} · ${fmtDate(d.radicado.fecha)}</span>`
    : `<button class="btn secondary small" data-radicar="${d.id}">Radicar documento</button>`;

  let firmasHtml = '';
  if(t.signable){
    const firmantes = d.data.firmantes || [];
    if(!firmantes.length){
      firmasHtml = `<div class="panel"><h3>Solicitud de firma</h3><div class="empty">Agrega partes firmantes editando el documento (nombre, correo, cargo) para poder solicitar su firma.</div></div>`;
    } else {
      firmasHtml = `<div class="panel"><h3>Solicitud de firma</h3><div class="sign-panel">
        ${firmantes.map((f,i)=>{
          const rec = f.token ? FIRMAS[f.token] : null;
          const firmado = rec && rec.estado==='firmado';
          return `<div class="sign-row">
            <div class="who"><b>${esc(f.nombre)||'—'}</b><span>${esc(f.correo)||'sin correo'} · ${esc(f.cargo)||''}</span></div>
            <div>
              ${firmado ? `<span class="badge2 firmado">Firmado ${fmtDate(rec.firmadoEn?rec.firmadoEn.slice(0,10):'')}</span>`
                        : `<span class="badge2 pend">Pendiente</span>
                           <button class="btn secondary small" data-genlink="${d.id}:${i}">Copiar enlace</button>
                           <button class="btn secondary small" data-sendmail="${d.id}:${i}">Enviar por correo</button>`}
            </div>
          </div>`;
        }).join('')}
      </div>
      <div class="desc" style="margin-top:10px;font-size:11.5px;">El enlace de firma solo funciona una vez este sistema esté publicado con un enlace público. "Enviar por correo" abre un borrador en tu propio correo — no se envía nada automáticamente.</div>
      </div>`;
    }
  }

  return `
    <div class="pagehead"><div><h2>${t.singular}</h2><div class="desc mono">${d.numero} ${radBadge}</div></div>
      <button class="btn secondary" data-back="1">← Volver</button></div>
    <div id="preview-wrap">
      <div class="preview-toolbar">
        <div></div>
        <div class="actions">
          <button class="btn secondary small" data-edit="${d.id}">Editar</button>
          <button class="btn small" onclick="window.print()">Imprimir / PDF</button>
        </div>
      </div>
      <div id="doc-sheet">${t.render(d.data, d.numero)}</div>
    </div>
    ${firmasHtml}`;
}

function renderRadicacion(){
  const rad = DOCS.filter(d=>d.radicado).sort((a,b)=>(b.radicado.folio||'').localeCompare(a.radicado.folio||''));
  const rows = rad.length ? rad.map(d=>{
    const t = TYPES[d.type];
    return `<div class="doc-card">
      <div><div class="num">${esc(d.radicado.folio)}</div><div class="title">${esc(t.titleOf(d.data))} — <span style="font-weight:400;color:var(--ink-soft)">${t.singular}</span></div>
      <div class="meta">Radicado el ${fmtDate(d.radicado.fecha)} por ${esc(d.radicado.radicadoPor)||'—'} · ${d.numero}</div></div>
      <div class="actions"><button class="btn secondary small" data-viewrad="${d.id}">Ver</button></div>
    </div>`;
  }).join('') : `<div class="panel"><div class="empty">Todavía no se ha radicado ningún documento.</div></div>`;
  return `<div class="pagehead"><div><h2>Libro de Radicación</h2><div class="desc">Consecutivo único de documentos radicados formalmente</div></div></div>${rows}`;
}

function renderUsuarios(){
  const rows = USERS.length ? USERS.map(u=>`
    <div class="doc-card">
      <div><div class="title">${esc(u.nombre)}</div><div class="meta">${esc(u.email)} · rol: ${esc(u.rol)}</div></div>
      <div class="actions">${u.uid!==currentUser.uid ? `<button class="btn danger small" data-deluser="${u.uid}">Quitar del listado</button>`:'<span class="meta">(tú)</span>'}</div>
    </div>`).join('') : `<div class="panel"><div class="empty">Aún no hay más integrantes registrados.</div></div>`;
  return `
    <div class="pagehead"><div><h2>Usuarios del sistema</h2><div class="desc">Integrantes de la JAC con acceso al sistema</div></div></div>
    ${rows}
    <div class="panel"><h3>Agregar más integrantes</h3>
      <p style="font-size:13px;color:var(--ink-soft);margin:0 0 6px;">No hace falta que los crees tú uno por uno: comparte con cada persona el enlace del sistema y este código de acceso para que se registren ellas mismas desde la pestaña "Crear cuenta":</p>
      <div class="mono" style="background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px;display:inline-block;font-size:15px;">${esc(CODIGO_ACCESO_JAC)}</div>
    </div>`;
}

/* ---------------------------------------------------------------
   EVENTS
--------------------------------------------------------------- */
function attachHandlers(){
  const main = document.getElementById('main');

  main.querySelectorAll('[data-nav]').forEach(el=>el.onclick=()=>{
    const [mode,type]=el.dataset.nav.split(':'); view={mode:mode==='home'?'home':'list', type}; render();
  });
  main.querySelectorAll('[data-new]').forEach(el=>el.onclick=()=>{ view={mode:'form', type:el.dataset.new, editId:null}; render(); });
  main.querySelectorAll('[data-view]').forEach(el=>el.onclick=()=>{ view={mode:'preview', id:el.dataset.view, type:view.type}; render(); });
  main.querySelectorAll('[data-edit]').forEach(el=>el.onclick=()=>{
    const doc = DOCS.find(d=>d.id===el.dataset.edit);
    view={mode:'form', type:doc.type, editId:doc.id}; render();
  });
  main.querySelectorAll('[data-del]').forEach(el=>el.onclick=async()=>{
    if(!confirm('¿Eliminar este documento? Esta acción no se puede deshacer.')) return;
    DOCS = DOCS.filter(d=>d.id!==el.dataset.del);
    await saveDocs(); render();
  });
  const backBtn = main.querySelector('[data-back]');
  if(backBtn) backBtn.onclick=()=>{ view={mode:'list', type:view.type}; render(); };
  const cancelBtn = main.querySelector('[data-cancel]');
  if(cancelBtn) cancelBtn.onclick=()=>{ view={mode:'list', type:view.type}; render(); };

  const viewrad = main.querySelector('[data-viewrad]');
  if(viewrad) viewrad.onclick=()=>{ const d=DOCS.find(x=>x.id===viewrad.dataset.viewrad); view={mode:'preview', id:d.id, type:d.type}; render(); };

  const radBtn = main.querySelector('[data-radicar]');
  if(radBtn) radBtn.onclick=async ()=>{
    const d = DOCS.find(x=>x.id===radBtn.dataset.radicar);
    d.radicado = {folio: nextRadicado(), fecha: new Date().toISOString().slice(0,10), radicadoPor: currentUser.nombre};
    await saveDocs(); render();
  };

  main.querySelectorAll('[data-genlink],[data-sendmail]').forEach(btn=>btn.onclick=async ()=>{
    const key = btn.dataset.genlink || btn.dataset.sendmail;
    const [docId, idxStr] = key.split(':'); const idx = +idxStr;
    const d = DOCS.find(x=>x.id===docId);
    const f = d.data.firmantes[idx];
    if(!f.token){
      f.token = randToken();
      FIRMAS[f.token] = {docId:d.id, docType:d.type, nombre:f.nombre, correo:f.correo, cargo:f.cargo, estado:'pendiente'};
      await saveFirmas(); await saveDocs();
    }
    const link = location.href.split('?')[0] + '?firmar=' + f.token;
    if(btn.dataset.sendmail!==undefined){
      const t = TYPES[d.type];
      const subject = `Solicitud de firma — ${t.singular} (${d.numero})`;
      const body = `Hola ${f.nombre},\n\nTe comparto el siguiente documento del proyecto "Tejiendo Arte en la Tierra de Ensueño" para tu firma:\n\n${link}\n\nGracias,\n${currentUser.nombre}`;
      location.href = `mailto:${f.correo||''}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
    } else {
      try{ await navigator.clipboard.writeText(link); alert('Enlace de firma copiado:\n'+link); }
      catch(e){ prompt('Copia este enlace de firma:', link); }
    }
    render();
  });

  main.querySelectorAll('[data-deluser]').forEach(btn=>btn.onclick=async ()=>{
    if(!confirm('¿Quitar a este integrante del listado del sistema? (Esto no elimina su cuenta de acceso, solo su perfil aquí; si quieres bloquearlo del todo, hazlo desde la consola de Firebase.)')) return;
    try{ await withTimeout(db.collection('usuarios').doc(btn.dataset.deluser).delete()); }catch(e){ alert('No se pudo quitar: '+(e.message||e)); }
    await loadUsers(); render();
  });

  main.querySelectorAll('[data-addrow]').forEach(el=>el.onclick=()=>{
    const key = el.dataset.addrow;
    const t = TYPES[view.type];
    const f = t.fields.find(f=>f.id===key);
    const tbody = el.previousElementSibling.querySelector('tbody');
    tbody.insertAdjacentHTML('beforeend', tableRow(f,{}));
    attachTableRowRemovers(main);
  });
  attachTableRowRemovers(main);

  const form = document.getElementById('doc-form');
  if(form) form.onsubmit = async (e)=>{
    e.preventDefault();
    const t = TYPES[view.type];
    const data = {};
    t.fields.forEach(f=>{
      if(f.type==='checkboxes'){
        const wrap = form.querySelector(`[data-field="${f.id}"]`);
        data[f.id] = Array.from(wrap.querySelectorAll('input:checked')).map(i=>i.value);
      } else if(f.type==='table'){
        const wrap = form.querySelector(`[data-table="${f.id}"]`);
        const rows = Array.from(wrap.querySelectorAll('tbody tr')).map(tr=>{
          const row={};
          tr.querySelectorAll('[data-col]').forEach(inp=>row[inp.dataset.col]=inp.value);
          return row;
        }).filter(r=>Object.values(r).some(v=>v));
        data[f.id]=rows;
      } else {
        const inp = form.querySelector(`[data-field="${f.id}"]`);
        data[f.id]=inp.value;
      }
    });
    if(view.editId){
      const doc = DOCS.find(d=>d.id===view.editId);
      doc.data = data;
    } else {
      DOCS.push({id:'d'+Date.now(), type:view.type, numero:nextConsecutivo(view.type), data});
    }
    await saveDocs();
    view = {mode:'list', type:view.type};
    render();
  };
}
function attachTableRowRemovers(main){
  main.querySelectorAll('[data-rmrow]').forEach(btn=>btn.onclick=()=>{
    const tr = btn.closest('tr');
    if(tr.parentElement.children.length>1) tr.remove();
  });
}

/* ---------------------------------------------------------------
   STANDALONE PAGES: setup / login / firmar (sin sidebar)
--------------------------------------------------------------- */
function renderStandalone(){
  const app = document.getElementById('app');
  if(view.mode==='auth') app.innerHTML = standaloneWrap(authHtml());
  else if(view.mode==='firmar') app.innerHTML = firmarHtml();
  attachStandaloneHandlers();
}
function standaloneWrap(inner){ return `<div class="standalone"><div class="auth-card">${inner}</div></div>`; }

function storageWarningHtml(){
  return storageAvailable ? '' : `<div class="error">No se pudo conectar con Firebase. Revisa que hayas pegado correctamente los datos de tu proyecto en firebaseConfig, y que el archivo esté publicado con un enlace propio (no solo en la vista previa del chat).</div>`;
}
function authHtml(){
  const tab = view.tab || 'login';
  return `
    <div class="tag">Tejiendo Arte en la Tierra de Ensueño</div>
    <h1>${tab==='login' ? 'Ingresar al sistema' : 'Crear tu cuenta'}</h1>
    <div class="sub">Sistema documental de la JAC Central Urbana — Maceo, Antioquia</div>
    ${storageWarningHtml()}
    ${view.error?`<div class="error">${esc(view.error)}</div>`:''}
    <div style="display:flex;gap:6px;margin-bottom:16px;">
      <button type="button" id="tab-login" class="btn ${tab==='login'?'':'secondary'} small" style="flex:1;">Iniciar sesión</button>
      <button type="button" id="tab-signup" class="btn ${tab==='signup'?'':'secondary'} small" style="flex:1;">Crear cuenta</button>
    </div>
    ${tab==='login' ? `
    <form id="login-form">
      <div class="field"><label>Correo</label><input type="text" id="li-correo" required></div>
      <div class="field"><label>Contraseña</label><input type="password" id="li-pass" required></div>
      <button class="btn" type="submit" id="login-btn">Entrar</button>
    </form>
    <div class="note">¿Olvidaste tu contraseña? Pídele a un integrante que te ayude, o usa la opción de recuperación desde tu correo si la habilitas en Firebase.</div>` : `
    <form id="signup-form">
      <div class="field"><label>Nombre completo</label><input type="text" id="su-nombre" required></div>
      <div class="field"><label>Correo</label><input type="text" id="su-correo" required></div>
      <div class="field"><label>Contraseña (mínimo 6 caracteres)</label><input type="password" id="su-pass" required></div>
      <div class="field"><label>Código de acceso de la JAC</label><input type="text" id="su-codigo" required></div>
      <button class="btn" type="submit" id="signup-btn">Crear cuenta y entrar</button>
    </form>
    <div class="note">Pide el código de acceso a quien administra el sistema. Este acceso organiza quién usa el sistema, pero para información altamente confidencial se recomienda una revisión de seguridad adicional.</div>`}`;
}

function firmarHtml(){
  const rec = FIRMAS[view.token];
  if(!rec) return standaloneWrap(`<div class="tag">Firma electrónica</div><h1>Enlace no válido</h1><div class="sub">Este enlace de firma no existe o ya no está disponible.</div>`);
  const d = DOCS.find(x=>x.id===rec.docId);
  if(!d) return standaloneWrap(`<div class="tag">Firma electrónica</div><h1>Documento no encontrado</h1>`);
  const t = TYPES[d.type];
  if(rec.estado==='firmado'){
    return `<div class="standalone"><div>
      <div class="sign-doc-frame"><div id="doc-sheet">${t.render(d.data, d.numero)}</div></div>
      <div class="sign-actions"><div class="confirm-box">✓ Documento firmado por ${esc(rec.firmaTexto)}<br><span style="font-family:'Work Sans',sans-serif;font-size:13px;color:var(--ink-soft)">el ${fmtDate(rec.firmadoEn.slice(0,10))} a las ${rec.firmadoEn.slice(11,16)}</span></div></div>
    </div></div>`;
  }
  return `<div class="standalone"><div>
    <div class="sign-doc-frame"><div id="doc-sheet">${t.render(d.data, d.numero)}</div></div>
    <div class="sign-actions">
      <h3 style="margin:0 0 4px;">Firmar este documento</h3>
      <div class="desc">Solicitado a ${esc(rec.nombre)} (${esc(rec.correo)||'sin correo'})</div>
      <label>Nombre completo de quien firma</label>
      <input type="text" id="fw-nombre" value="${esc(rec.nombre)}">
      <div class="accept"><input type="checkbox" id="fw-accept"><label style="margin:0;text-transform:none;font-weight:400;">He leído este documento y acepto firmarlo electrónicamente. Entiendo que esta firma queda registrada con fecha, hora y el nombre que escribí arriba.</label></div>
      <button class="btn" id="fw-submit" style="margin-top:16px;">Firmar documento</button>
    </div>
  </div></div>`;
}

function attachStandaloneHandlers(){
  const tabLogin = document.getElementById('tab-login');
  const tabSignup = document.getElementById('tab-signup');
  if(tabLogin) tabLogin.onclick = ()=>{ view={mode:'auth', tab:'login'}; renderStandalone(); };
  if(tabSignup) tabSignup.onclick = ()=>{ view={mode:'auth', tab:'signup'}; renderStandalone(); };

  const signupForm = document.getElementById('signup-form');
  if(signupForm) signupForm.onsubmit = async (e)=>{
    e.preventDefault();
    const btn = document.getElementById('signup-btn');
    const nombre = document.getElementById('su-nombre').value.trim();
    const correo = document.getElementById('su-correo').value.trim();
    const pass = document.getElementById('su-pass').value;
    const codigo = document.getElementById('su-codigo').value.trim();
    if(!nombre||!correo||!pass){ alert('Completa nombre, correo y contraseña.'); return; }
    if(codigo!==CODIGO_ACCESO_JAC){ view={mode:'auth', tab:'signup', error:'El código de acceso de la JAC no es correcto.'}; renderStandalone(); return; }
    try{
      if(btn){ btn.disabled=true; btn.textContent='Creando cuenta…'; }
      const cred = await withTimeout(auth.createUserWithEmailAndPassword(correo, pass));
      await withTimeout(db.collection('usuarios').doc(cred.user.uid).set({nombre, email:correo, rol:'Miembro'}));
      // onAuthStateChanged se encarga de cargar el perfil y mostrar la app
    }catch(err){
      view = {mode:'auth', tab:'signup', error: traducirErrorFirebase(err)};
      renderStandalone();
    }
  };

  const loginForm = document.getElementById('login-form');
  if(loginForm) loginForm.onsubmit = async (e)=>{
    e.preventDefault();
    const btn = document.getElementById('login-btn');
    const correo = document.getElementById('li-correo').value.trim();
    const pass = document.getElementById('li-pass').value;
    try{
      if(btn){ btn.disabled=true; btn.textContent='Entrando…'; }
      await withTimeout(auth.signInWithEmailAndPassword(correo, pass));
      // onAuthStateChanged se encarga del resto
    }catch(err){
      view = {mode:'auth', tab:'login', error: traducirErrorFirebase(err)};
      renderStandalone();
    }
  };
  const fwSubmit = document.getElementById('fw-submit');
  if(fwSubmit) fwSubmit.onclick = async ()=>{
    try{
      const nombre = document.getElementById('fw-nombre').value.trim();
      const accept = document.getElementById('fw-accept').checked;
      if(!nombre || !accept){ alert('Escribe tu nombre completo y acepta la declaración para firmar.'); return; }
      await loadFirmas(); await loadDocs();
      const rec = FIRMAS[view.token];
      rec.estado = 'firmado'; rec.firmaTexto = nombre; rec.firmadoEn = new Date().toISOString();
      await saveFirmas();
      const d = DOCS.find(x=>x.id===rec.docId);
      if(d && d.data.firmantes){
        const f = d.data.firmantes.find(f=>f.token===view.token);
        if(f) f.estado='firmado';
        await saveDocs();
      }
      renderStandalone();
    }catch(err){ alert('No se pudo registrar la firma: '+(err.message||err)); }
  };
}

function traducirErrorFirebase(err){
  const code = err && err.code || '';
  const map = {
    'auth/email-already-in-use':'Ese correo ya tiene una cuenta — usa "Iniciar sesión" en vez de "Crear cuenta".',
    'auth/invalid-email':'El correo no es válido.',
    'auth/weak-password':'La contraseña debe tener al menos 6 caracteres.',
    'auth/wrong-password':'Correo o contraseña incorrectos.',
    'auth/user-not-found':'No existe una cuenta con ese correo. Usa "Crear cuenta".',
    'auth/invalid-credential':'Correo o contraseña incorrectos.',
    'auth/network-request-failed':'No hay conexión con Firebase — revisa tu internet o los datos de firebaseConfig.',
    'auth/configuration-not-found':'La autenticación por correo/contraseña no está habilitada en tu proyecto de Firebase (actívala en Authentication → Sign-in method).',
  };
  return map[code] || (err && err.message) || String(err);
}

function showFatalError(msg){
  const app = document.getElementById('app');
  if(!app) return;
  app.innerHTML = `<div class="standalone"><div class="auth-card">
    <div class="tag">Error</div><h1>Algo falló al cargar</h1>
    <div class="error">${esc(String(msg))}</div>
    <div class="note">Copia este mensaje tal cual y compártelo para poder corregirlo. Puedes intentar recargar la página.</div>
  </div></div>`;
}
window.addEventListener('error', e=>{ showFatalError((e.error&&e.error.message)||e.message||'Error desconocido'); });
window.addEventListener('unhandledrejection', e=>{ showFatalError((e.reason&&e.reason.message)||e.reason||'Error desconocido'); });

/* boot */
(async function(){
 try{
  const params = new URLSearchParams(location.search);
  const token = params.get('firmar');
  if(token){
    await Promise.all([loadDocs(), loadFirmas()]);
    view = {mode:'firmar', token};
    renderStandalone();
    return;
  }
  if(!auth || !db){ view={mode:'auth', tab:'login', error:'Falta configurar Firebase: pega tus datos de firebaseConfig en el código.'}; renderStandalone(); return; }

  auth.onAuthStateChanged(async (user)=>{
    if(user){
      try{
        const prof = await withTimeout(db.collection('usuarios').doc(user.uid).get());
        currentUser = prof.exists ? {uid:user.uid, email:user.email, ...prof.data()} : {uid:user.uid, email:user.email, nombre:user.email, rol:'Miembro'};
        await Promise.all([loadDocs(), loadUsers(), loadFirmas()]);
        view = {mode:'home'}; showApp();
      }catch(e){ showFatalError(e.message||e); }
    } else {
      currentUser = null;
      view = {mode:'auth', tab:'login'};
      renderStandalone();
    }
  });
 }catch(e){ showFatalError(e.message || e); }
})();
</script>
